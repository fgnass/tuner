<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon + apple-touch + splash-screen links are injected at build time by
         vite-plugin-pwa / @vite-pwa/assets-generator (see pwa-assets.config.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#473144" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Tuner</title>
    <meta
      name="description"
      content="A free, full-screen instrument tuner that runs entirely in your browser — no app, no account, no network."
    />

    <!-- Open Graph / social preview (public/og.png, 2400×1260). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gnass.buzz" />
    <meta property="og:url" content="https://tuner.gnass.buzz/" />
    <meta property="og:title" content="Tuner" />
    <meta
      property="og:description"
      content="A free, full-screen instrument tuner that runs entirely in your browser — no app, no account, no network."
    />
    <meta property="og:image" content="https://tuner.gnass.buzz/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Tuner — gnass.buzz" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tuner" />
    <meta
      name="twitter:description"
      content="A free, full-screen instrument tuner that runs entirely in your browser — no app, no account, no network."
    />
    <meta name="twitter:image" content="https://tuner.gnass.buzz/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
